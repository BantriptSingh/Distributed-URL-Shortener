# Local / Testcontainers override via env. Secrets: see repo .env.example.

server:
  port: 8080
  servlet:
    async-request-timeout: 300000

spring:
  application.name: shortener
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shortener}
    username: ${SPRING_DATASOURCE_USERNAME:shortener}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  data.redis:
    url: ${REDIS_URL:redis://localhost:6379}
    repositories.enabled: false
  flyway.enabled: true

management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  cache:
    positive-ttl: 24h
    negative-ttl: 30s
  short-code:
    length: 7
    max-retries: 5
  clicks:
    stream: clicks
    group: click-workers
    maxlen: 100000
    consumer-enabled: true
    block: 2s
    claim-idle: 60s
  jwt:
    access-ttl: 15m
    refresh-ttl: 14d
  unlock-ttl: 5m
  claim-ttl: 7d
  live-sse-max: 500
  rate-limit:
    guest-create-per-minute: 30
    jwt-create-per-minute: 120
    api-key-write-per-minute: 300
    redirect-per-minute: 600
    auth-per-minute: 10
    unlock-per-minute: 10
